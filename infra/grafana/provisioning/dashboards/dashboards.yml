apiVersion: 1

providers:
  - name: shop-platform
    type: file
    # Дашборды правятся в UI, но сохраняются в файлы этого каталога:
    # allowUiUpdates оставлен выключенным, чтобы правки не терялись молча при рестарте.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
