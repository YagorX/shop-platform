apiVersion: 1

datasources:
  - name: Prometheus
    # Фиксированный uid: на него ссылаются панели в infra/grafana/dashboards/*.json.
    # Если его менять, дашборды перестанут находить источник данных.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Совпадает с scrape_interval в prometheus.yml — Grafana подбирает шаг графиков по нему.
      timeInterval: 5s
